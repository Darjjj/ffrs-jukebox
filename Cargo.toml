[package]
name = "ffrs-jukebox"
version = "1.4.2"
edition = "2024"
license = "MIT"
description = "In-game jukebox for FINAL FANTASY RESONANCE"
repository = "https://github.com/Darjjj/ffrs-jukebox"

[lib]
name = "ffrs_jukebox"
crate-type = ["cdylib"]

[dependencies]
grapnel = "=0.1.2"
sdk = { path = "deps/final-fantasy-resonance-fix/5.6.1-0+UE5-FFRS/RustSDK" }
hudhook = { version = "0.8", default-features = false, features = ["dx12", "inject"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
log = "0.4"
fern = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "unwind"
